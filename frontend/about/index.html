<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The title and description are filled in from src/about/content.ts by the build (vite.config.ts). -->
    <meta name="description" content="%ABOUT_DESCRIPTION%" />
    <title>%ABOUT_TITLE%</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before the first paint, so dark mode never flashes light.
      try {
        const saved = localStorage.getItem("saathi.theme");
        const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/about/main.tsx"></script>
  </body>
</html>
