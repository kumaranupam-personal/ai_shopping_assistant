# nginx inside the frontend container (docs/13-deployment.md): serves the build under /saathi/, the chat at /saathi/
# and the about page at /saathi/about/, and redirects the old addresses there. The server's own nginx sits in front
# of it and sends /saathi/api/ to the API container instead.
server {
    listen 8080;
    root /usr/share/nginx/html; # the build is copied to html/saathi/
    server_tokens off;
    # Redirects carry only the path. A full URL would name this container's own scheme and port (http, 8080), not
    # the visitor's, since the server's nginx sits in front.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # The domain root leads to the about page. 302, not 301, because browsers keep a 301 for good and the root may
    # later lead elsewhere. The about page's old address moved for good.
    location = / {
        return 302 /saathi/about/$is_args$args;
    }
    location = /saathi {
        return 301 /saathi/$is_args$args;
    }
    # Only the old forms: /saathi/about/ itself must not match, or it would redirect to itself.
    location ~ ^/(about/?|saathi/about)$ {
        return 301 /saathi/about/$is_args$args;
    }

    # A location's add_header replaces the server's, so each location sets all of its headers.
    # Hashed file names never change, so they are cached for a year; everything else is revalidated.
    location /saathi/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location /saathi/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ =404;
    }

    # Nothing else is part of this app.
    location / {
        return 404;
    }
}
