# nginx inside the frontend container (docs/13-deployment.md): serves the build, the chat at / and the about page at
# /about/. The server's own nginx sits in front of it and sends /api/ to the API container instead.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirects, such as /about to /about/, carry only the path. A full URL would name this container's own
    # scheme and port (http, 8080), not the visitor's, since the server's nginx sits in front.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # A location's add_header replaces the server's, so each location sets all of its headers.
    # Hashed file names never change, so they are cached for a year; everything else is revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ =404;
    }
}
