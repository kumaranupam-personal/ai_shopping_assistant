[project]
name = "ai-shopping-assistant"
version = "0.1.0"
requires-python = "~=3.12.0"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "google-genai>=2.27.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=3.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
