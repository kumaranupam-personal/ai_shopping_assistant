[project]
name = "ai-shopping-assistant"
version = "0.1.0"
requires-python = "~=3.12.0"
dependencies = [
    "anthropic>=1.11.0",
    "fastembed>=0.8.1",
    "numpy>=2.5.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
