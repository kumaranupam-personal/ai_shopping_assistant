  turns: ['Mummy ke liye phone chahiye, 6000 mAh battery ya usse zyada, 12000 ke andar']
  expect:
    shown:
      category: phones
      price_max: 12000
      attributes:
        battery_mah: {min: 6000}
    min_shown: 3
    reply_language: hinglish
- id: hinglish-khadi-kurta
  description: Fabric, size and an "Rs 1800 tak" budget.
  turns: ['Bhai ke liye khadi kurta, M size, Rs 1800 tak']
  expect:
    shown:
      category: kurtas
      price_max: 1800
      size: M
      attributes: {fabric: khadi}
    min_shown: 3
    reply_language: hinglish
- id: hinglish-school-backpack
  description: A color and a "2500 rupees tak" budget for a child's school bag (enough results even if use daily is inferred).
  turns: ['Beti ke school ke liye black backpack chahiye, 2500 rupees tak']
  expect:
    shown: {category: backpacks, price_max: 2500, color: black}
    min_shown: 3
    reply_language: hinglish
- id: watches-swim-100m
  description: A stated water resistance with a "12k" budget.
  turns: ['Need a watch I can swim with, 100m water resistant, under 12k']
  expect:
    shown:
      category: watches
      price_max: 12000
      attributes:
        water_resistance_m: {min: 100}
    min_shown: 3
- id: hinglish-mixer-wattage
  description: An appliance type with a power minimum ("750 watt ya usse zyada") and "4000 tak".
  turns: ['750 watt ya usse zyada ka mixer grinder chahiye, 4000 tak']
  expect:
    shown:
      category: kitchen_appliances
      price_max: 4000
      attributes:
        type: mixer_grinder
        power_w: {min: 750}
