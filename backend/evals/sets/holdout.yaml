# HOLDOUT SET (docs/07-evaluation.md): never used for tuning. Run only to report a finished prompt version, once per
# provider, with `--set holdout`, and log every run in evals/README.md. A case whose failure leads to a prompt or tool
# change moves to sets/dev.yaml and is replaced here by a new one. Same format as sets/dev.yaml.
#
# 40 cases from a pool of 60 written without the prompt and split at random with dev (see evals/README.md): 14 search, 8 refinement, 6 question, 4 clarify, 4 decline, 4 relax; 14 multi-turn.

# Single-turn searches with hard constraints, budgets written in different ways.

- id: hinglish-black-leather-jacket
  description: Color, jacket type, size and a "10 hazaar tak" budget, in Hinglish.
  turns: ['Black leather jacket dikhao, XL size, 10 hazaar tak']
  expect:
    shown:
      category: jackets
      price_max: 10000
      size: XL
      color: black
      attributes: {type: leather}
    min_shown: 3
    reply_language: hinglish
- id: phones-ram-storage-range
  description: Two numeric attributes and a budget range written as "between 25k and 40k".
  turns: ['Phone with 12 GB RAM and 256 GB storage, between 25k and 40k']
  expect:
    shown:
      category: phones
      price_min: 25000
      price_max: 40000
      attributes:
        ram_gb: {min: 12}
        storage_gb: {min: 256}
    min_shown: 3
- id: backpacks-capacity-range
  description: A numeric range ("between 30 and 40 litres") and a boolean, with no budget.
  turns: [Waterproof travel backpack between 30 and 40 litres]
  expect:
    shown:
      category: backpacks
      attributes:
        waterproof: true
        capacity_l: {min: 30, max: 40}
    min_shown: 3
- id: kurtas-linen-men-xl
  description: Fabric, gender and size with a range written as "between 1k and 2.5k".
  turns: ['Men''s linen kurta in XL, between 1k and 2.5k']
  expect:
    shown:
      category: kurtas
      price_min: 1000
      price_max: 2500
      size: XL
      attributes: {fabric: linen, gender: men}
    min_shown: 3
- id: kitchen-kettle-warranty
  description: An appliance type with a minimum warranty and a "₹2,000" budget.
  turns: ['electric kettle with at least 2 years warranty, under ₹2,000']
  expect:
    shown:
      category: kitchen_appliances
      price_max: 2000
      attributes:
        type: electric_kettle
        warranty_years: {min: 2}
    min_shown: 3
- id: laptops-business-14in
  description: A stated laptop use and screen size with a budget written as "1 lakh".
  turns: ['Business laptop with a 14 inch screen, under 1 lakh']
  expect:
    shown:
      category: laptops
      price_max: 100000
      attributes: {use: business, screen_in: 14}
    min_shown: 3
- id: hinglish-work-laptop-bag
  description: '"Bag" with a laptop compartment is a backpack, and "Rs 2500 tak" is the budget.'
  turns: ['Kaam pe roz laptop le jaata hoon, laptop compartment wala bag chahiye, Rs 2500 tak']
  expect:
    shown:
      category: backpacks
      price_max: 2500
      attributes: {laptop_compartment: true}
    min_shown: 3
    reply_language: hinglish
- id: shoes-stridex-formal
  description: A terse request with a brand, a color, a type and a bare size number.
  turns: ['StrideX formal shoes, grey, size 11']
  expect:
    shown:
      category: shoes
      brand: [StrideX]
      color: grey
      size: UK 11
      attributes: {type: formal}
    min_shown: 3
    reply_language: english
- id: hinglish-ladies-cotton-kurta
  description: Gender, fabric, sleeve and size, in Hinglish.
  turns: ['Ladies ke liye cotton kurta, three-quarter sleeve, L size']
  expect:
    shown:
